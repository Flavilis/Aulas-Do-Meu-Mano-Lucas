<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Loja Simples - Controle de Produtos</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Loja Simples</h1>
      <p>Controle de produtos - Aula 1</p>
    </header>

    <main>
      <section class="cartao">
        <h2>Novo produto</h2>
        <form id="form-produto">
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" placeholder="Ex: Caderno" required />

          <label for="preco">Preço (R$)</label>
          <input type="number" id="preco" name="preco" step="0.01" min="0" placeholder="Ex: 12.50" required />

          <label for="quantidade">Quantidade</label>
          <input type="number" id="quantidade" name="quantidade" min="0" placeholder="Ex: 10" required />

          <label for="coloracao">Coloração</label>
          <input type="text" id="coloracao" name="coloracao" placeholder="Ex: Azul" required />
          <!--<select id="coloracao" name="coloracao" required>
            <option value="" disabled selected>Selecione uma cor</option>
            <option value="azul">Azul</option>
            <option value="vermelho">Vermelho</option>
            <option value="verde">Verde</option>
            <option value="amarelo">Amarelo</option>
            <option value="preto">Preto</option>
            <option value="branco">Branco</option>
          </select>-->

          <button type="submit">Adicionar produto</button>
        </form>
      </section>

      <section class="cartao">
        <h2>Produtos cadastrados</h2>
        <ul id="lista-produtos">
          <li>Caderno - R$ 12.50 (30 un.)</li>
          <li>Caneta - R$ 2.00 (100 un.)</li>
          <li>Mochila - R$ 89.90 (8 un.)</li>
          <li>Estojo - R$ 15.00 (20 un.)</li>
        </ul>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
